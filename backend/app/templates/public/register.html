<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Alumni Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .register-container {
            width: 100%;
            max-width: 550px;
        }
        
        .register-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .register-header {
            background: white;
            padding: 2rem 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .register-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #2c3e50;
        }
        
        .register-header h1 i {
            color: #667eea;
        }
        
        .register-header p {
            color: #666;
            font-size: 0.9rem;
        }
        
        .register-body {
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #2c3e50;
            font-size: 0.9rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 1rem;
        }
        
        .input-group .form-control {
            padding-left: 2.5rem;
        }
        
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-size: 1rem;
        }
        
        .toggle-password:hover {
            color: #667eea;
        }
        
        .role-selector {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        
        .role-option {
            flex: 1;
            cursor: pointer;
        }
        
        .role-option input[type="radio"] {
            display: none;
        }
        
        .role-card {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .role-option input[type="radio"]:checked + .role-card {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .role-card i {
            font-size: 1.5rem;
            color: #667eea;
            margin-bottom: 0.5rem;
        }
        
        .role-card h4 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
            color: #2c3e50;
        }
        
        .role-card p {
            font-size: 0.75rem;
            color: #666;
        }
        
        .student-fields, .alumni-fields {
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .btn-register {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.5);
        }
        
        .btn-register.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .btn-register.loading i {
            animation: spin 1s linear infinite;
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
            font-size: 0.9rem;
            color: #666;
        }
        
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideDown 0.3s ease;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            
            .register-header {
                padding: 1.5rem;
            }
            
            .register-body {
                padding: 1.5rem;
            }
            
            .role-selector {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1>
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </h1>
                <p>Join the Alumni Portal community</p>
            </div>
            
            <div class="register-body">
                {% if error %}
                    <div class="alert alert-error">
                        <i class="fas fa-exclamation-circle"></i>
                        {{ error }}
                    </div>
                {% endif %}
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                <i class="fas {% if category == 'success' %}fa-check-circle{% elif category == 'error' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %}"></i>
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form action="/auth/register" method="POST" id="registerForm">
                    <div class="form-group">
                        <label for="full_name">Full Name *</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="full_name" name="full_name" class="form-control" 
                                   placeholder="Enter your full name" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" class="form-control" 
                                   placeholder="Enter your email" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" class="form-control" 
                                   placeholder="Create a password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm_password">Confirm Password *</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirm_password" name="confirm_password" class="form-control" 
                                   placeholder="Confirm your password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('confirm_password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>I am a *</label>
                        <div class="role-selector">
                            <label class="role-option">
                                <input type="radio" name="role" value="student" checked onchange="toggleRoleFields()">
                                <div class="role-card">
                                    <i class="fas fa-user-graduate"></i>
                                    <h4>Student</h4>
                                    <p>Looking for mentorship</p>
                                </div>
                            </label>
                            <label class="role-option">
                                <input type="radio" name="role" value="alumni" onchange="toggleRoleFields()">
                                <div class="role-card">
                                    <i class="fas fa-chalkboard-user"></i>
                                    <h4>Alumni</h4>
                                    <p>Ready to mentor others</p>
                                </div>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Student Fields -->
                    <div id="student-fields" class="student-fields">
                        <div class="form-group">
                            <label for="course">Course / Program</label>
                            <input type="text" id="course" name="course" class="form-control" 
                                   placeholder="e.g., Computer Science">
                        </div>
                        <div class="form-group">
                            <label for="graduation_year">Expected Graduation Year</label>
                            <input type="number" id="graduation_year" name="graduation_year" class="form-control" 
                                   placeholder="e.g., 2025">
                        </div>
                        <div class="form-group">
                            <label for="interests">Interests (comma separated)</label>
                            <textarea id="interests" name="interests" class="form-control" 
                                      placeholder="e.g., Technology, AI, Web Development"></textarea>
                        </div>
                    </div>
                    
                    <!-- Alumni Fields -->
                    <div id="alumni-fields" class="alumni-fields" style="display: none;">
                        <div class="form-group">
                            <label for="job_title">Job Title</label>
                            <input type="text" id="job_title" name="job_title" class="form-control" 
                                   placeholder="e.g., Software Engineer">
                        </div>
                        <div class="form-group">
                            <label for="company">Company</label>
                            <input type="text" id="company" name="company" class="form-control" 
                                   placeholder="e.g., Google, Microsoft">
                        </div>
                        <div class="form-group">
                            <label for="industry">Industry</label>
                            <input type="text" id="industry" name="industry" class="form-control" 
                                   placeholder="e.g., Technology, Finance">
                        </div>
                        <div class="form-group">
                            <label for="skills">Skills (comma separated)</label>
                            <textarea id="skills" name="skills" class="form-control" 
                                      placeholder="e.g., Python, React, Project Management"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="graduation_year_alumni">Graduation Year</label>
                            <input type="number" id="graduation_year_alumni" name="graduation_year" class="form-control" 
                                   placeholder="e.g., 2020">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-register" id="registerBtn">
                        <i class="fas fa-user-plus"></i>
                        Create Account
                    </button>
                </form>
                
                <div class="login-link">
                    Already have an account? <a href="/login">Sign in</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function togglePassword(fieldId) {
            const input = document.getElementById(fieldId);
            const icon = input.nextElementSibling.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        function toggleRoleFields() {
            const studentRadio = document.querySelector('input[value="student"]');
            const studentFields = document.getElementById('student-fields');
            const alumniFields = document.getElementById('alumni-fields');
            
            if (studentRadio.checked) {
                studentFields.style.display = 'block';
                alumniFields.style.display = 'none';
            } else {
                studentFields.style.display = 'none';
                alumniFields.style.display = 'block';
            }
        }
        
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            
            if (password !== confirm) {
                e.preventDefault();
                alert('Passwords do not match!');
                return false;
            }
            
            if (password.length < 6) {
                e.preventDefault();
                alert('Password must be at least 6 characters long!');
                return false;
            }
            
            const btn = document.getElementById('registerBtn');
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner"></i> Creating account...';
        });
        
        setTimeout(() => {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 300);
            });
        }, 5000);
    </script>
</body>
</html>
