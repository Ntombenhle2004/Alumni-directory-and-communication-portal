{% extends "alumni/base_alumni.html" %}

{% block title %}Chat - Alumni Portal{% endblock %}

{% block extra_css %}
{{ super() }}
<style>
    .chat-container {
        display: flex;
        gap: 1.5rem;
        height: calc(100vh - 200px);
        min-height: 500px;
    }
    
    .chat-sidebar {
        width: 320px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        overflow-y: auto;
        flex-shrink: 0;
    }
    
    .chat-sidebar h3 {
        padding: 1rem;
        margin: 0;
        border-bottom: 1px solid #f0f0f0;
        position: sticky;
        top: 0;
        background: white;
    }
    
    .chat-conversation {
        flex: 1;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    
    .conversation-item {
        padding: 1rem;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
        transition: background 0.2s;
    }
    
    .conversation-item:hover {
        background: #f8f9fa;
    }
    
    .conversation-item.active {
        background: #e8f0fe;
        border-left: 3px solid #667eea;
    }
    
    .conversation-name {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 0.25rem;
    }
    
    .conversation-preview {
        font-size: 0.85rem;
        color: #666;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    .chat-header {
        padding: 1rem;
        border-bottom: 1px solid #f0f0f0;
        background: #f8f9fa;
    }
    
    .chat-header h3 {
        margin: 0;
        color: #2c3e50;
    }
    
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    
    .message {
        display: flex;
        flex-direction: column;
        max-width: 70%;
    }
    
    .message.sent {
        align-self: flex-end;
    }
    
    .message.received {
        align-self: flex-start;
    }
    
    .message-bubble {
        padding: 0.75rem 1rem;
        border-radius: 12px;
        word-wrap: break-word;
    }
    
    .message.sent .message-bubble {
        background: #667eea;
        color: white;
        border-bottom-right-radius: 4px;
    }
    
    .message.received .message-bubble {
        background: #f1f3f4;
        color: #2c3e50;
        border-bottom-left-radius: 4px;
    }
    
    .message-time {
        font-size: 0.7rem;
        color: #999;
        margin-top: 0.25rem;
        align-self: flex-end;
    }
    
    .message.received .message-time {
        align-self: flex-start;
    }
    
    .chat-input-area {
        padding: 1rem;
        border-top: 1px solid #f0f0f0;
        display: flex;
        gap: 0.5rem;
        background: white;
    }
    
    .chat-input {
        flex: 1;
        padding: 0.75rem;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        font-size: 0.95rem;
        resize: none;
        font-family: inherit;
    }
    
    .chat-input:focus {
        outline: none;
        border-color: #667eea;
    }
    
    .send-btn {
        padding: 0.75rem 1.5rem;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 500;
    }
    
    .send-btn:hover {
        background: #764ba2;
        transform: translateY(-2px);
    }
    
    .empty-state {
        text-align: center;
        padding: 2rem;
        color: #666;
    }
    
    .empty-state i {
        font-size: 3rem;
        color: #ccc;
        margin-bottom: 1rem;
    }
    
    .status-badge {
        display: inline-block;
        padding: 0.2rem 0.5rem;
        border-radius: 12px;
        font-size: 0.7rem;
        font-weight: 500;
        margin-left: 0.5rem;
    }
    
    .status-online {
        background: #d4edda;
        color: #155724;
    }
    
    .status-offline {
        background: #e9ecef;
        color: #6c757d;
    }
</style>
{% endblock %}

{% block alumni_content %}
<div class="chat-container">
    <!-- Conversations Sidebar -->
    <div class="chat-sidebar">
        <h3><i class="fas fa-comments"></i> Messages</h3>
        <div id="conversationsList">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading conversations...</p>
            </div>
        </div>
    </div>
    
    <!-- Active Conversation -->
    <div class="chat-conversation">
        <div class="chat-header">
            <h3 id="chatHeader">Select a conversation</h3>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="empty-state">
                <i class="fas fa-comments"></i>
                <p>Select a conversation to start chatting</p>
            </div>
        </div>
        <div class="chat-input-area" id="chatInputArea" style="display: none;">
            <textarea class="chat-input" id="messageInput" rows="2" placeholder="Type your message..." onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
            <button class="send-btn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i> Send
            </button>
        </div>
    </div>
</div>

<script>
    let currentConversationId = null;
    let currentOtherUserId = null;
    let currentOtherUserName = '';
    const currentUserId = {{ user.id }};
    
    // Load conversations
    function loadConversations() {
        fetch('/api/chat/my-conversations')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('conversationsList');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No messages yet. Start a conversation with your mentees!</p></div>';
                    return;
                }
                
                container.innerHTML = data.map(conv => `
                    <div class="conversation-item ${currentConversationId === conv.id ? 'active' : ''}" 
                         onclick="loadConversation(${conv.id}, ${conv.other_user_id}, '${conv.other_user_name.replace(/'/g, "\\'")}')">
                        <div class="conversation-name">${conv.other_user_name}</div>
                        <div class="conversation-preview">${conv.last_message || 'No messages yet'}</div>
                    </div>
                `).join('');
            })
            .catch(error => {
                console.error('Error loading conversations:', error);
                document.getElementById('conversationsList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Error loading conversations</p></div>';
            });
    }
    
    // Load a specific conversation
    function loadConversation(convId, otherUserId, otherUserName) {
        currentConversationId = convId;
        currentOtherUserId = otherUserId;
        currentOtherUserName = otherUserName;
        
        document.getElementById('chatHeader').innerHTML = otherUserName;
        document.getElementById('chatInputArea').style.display = 'flex';
        document.getElementById('messageInput').disabled = false;
        
        // Clear input
        document.getElementById('messageInput').value = '';
        
        // Load messages
        fetch(`/api/chat/history/${convId}/viewer/${currentUserId}`)
            .then(response => response.json())
            .then(messages => {
                const container = document.getElementById('chatMessages');
                if (!messages || messages.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-comment"></i><p>No messages yet. Start the conversation!</p></div>';
                    return;
                }
                
                container.innerHTML = messages.map(msg => `
                    <div class="message ${msg.sender_id == currentUserId ? 'sent' : 'received'}">
                        <div class="message-bubble">${escapeHtml(msg.text)}</div>
                        <div class="message-time">${msg.sent_at}</div>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            })
            .catch(error => {
                console.error('Error loading messages:', error);
                document.getElementById('chatMessages').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Error loading messages</p></div>';
            });
    }
    
    // Send a message
    function sendMessage() {
        const messageInput = document.getElementById('messageInput');
        const message = messageInput.value.trim();
        
        if (!message) return;
        
        // Disable input while sending
        messageInput.disabled = true;
        
        fetch('/api/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                conversation_id: currentConversationId,
                sender_id: currentUserId,
                message: message,
                message_type: 'text'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.message) {
                messageInput.value = '';
                // Reload messages
                loadConversation(currentConversationId, currentOtherUserId, currentOtherUserName);
            } else if (data.error) {
                alert('Error sending message: ' + data.error);
            }
            messageInput.disabled = false;
            messageInput.focus();
        })
        .catch(error => {
            console.error('Error sending message:', error);
            alert('Error sending message. Please try again.');
            messageInput.disabled = false;
        });
    }
    
    // Helper function to escape HTML
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Auto-refresh conversations every 15 seconds
    let refreshInterval;
    
    // Start auto-refresh
    function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            loadConversations();
            if (currentConversationId) {
                loadConversation(currentConversationId, currentOtherUserId, currentOtherUserName);
            }
        }, 15000);
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        loadConversations();
        startAutoRefresh();
        
        // Focus on input when conversation is loaded
        const observer = new MutationObserver(() => {
            if (document.getElementById('chatInputArea').style.display === 'flex') {
                document.getElementById('messageInput').focus();
            }
        });
        observer.observe(document.getElementById('chatInputArea'), { attributes: true });
    });
</script>
{% endblock %}
